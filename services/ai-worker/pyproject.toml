[project]
name = "buildmind-ai-worker"
version = "5.0.0"
description = "BuildMind AI v5.0 — Computer Vision & NLP Worker for Quantity Surveying"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
