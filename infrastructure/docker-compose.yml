version: '3.8'

services:
  # ==========================================
  # PostgreSQL 16 Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: buildmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buildmind_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildmind_dev_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-buildmind_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildmind_app} -d ${POSTGRES_DB:-buildmind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis 7 Cache & Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: buildmind-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MinIO S3-Compatible Object Storage
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: buildmind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_buildmind_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_buildmind_secret_change_in_prod}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  # MinIO Bucket Auto-initializer
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: buildmind-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio_buildmind_access} ${S3_SECRET_KEY:-minio_buildmind_secret_change_in_prod};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_DRAWINGS:-buildmind-drawings};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET_DOCUMENTS:-buildmind-documents};
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
